name: CI

# Sem o filtro de branch abaixo, um push numa branch de PR dispara `push` e
# `pull_request` para o mesmo commit e a matriz roda duas vezes. `main` continua
# coberta pelo push pós-merge, e toda branch de trabalho pelo pull_request.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# Um push novo sobre um PR aposenta a run anterior; em `main` nada é cancelado,
# porque cada commit lá precisa do seu próprio veredito.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  browser:
    name: Browser / ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(github.event_name == 'push' && '["chromium","firefox","webkit"]' || '["chromium"]') }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}

      - name: Install browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Install browser system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.browser }}

      - name: Run browser tests
        run: npm run build:browser && npx playwright test --project=${{ matrix.browser }}

  test:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            laravel: '12'
            illuminate: '^12.41.1'
            testbench: '^10.6'
          - php: '8.3'
            laravel: '13'
            illuminate: '^13.24'
            testbench: '^11.1'
          - php: '8.4'
            laravel: '12'
            illuminate: '^12.41.1'
            testbench: '^10.6'
          - php: '8.4'
            laravel: '13'
            illuminate: '^13.24'
            testbench: '^11.1'

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Select Laravel and Testbench versions
        run: |
          composer require --no-update \
            "illuminate/support:${{ matrix.illuminate }}" \
            "illuminate/view:${{ matrix.illuminate }}"
          composer require --dev --no-update \
            "orchestra/testbench:${{ matrix.testbench }}"

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Run tests
        run: vendor/bin/pest
