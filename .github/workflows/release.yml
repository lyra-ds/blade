# Release PRs created with GITHUB_TOKEN do not trigger workflows because of GitHub's
# anti-recursion protection, so required CI checks would never run on the release PR.
# Use a fine-grained RELEASE_PLEASE_PAT scoped only to this repository, owned by
# franciscpd, with Contents and Pull requests permissions. If the PAT expires, the
# symptom is release PRs appearing with no checks.
#
# There is no publish step: Packagist publishes from its GitHub webhook when the tag
# is pushed.
#
# IMPORTANT: Remove `release-as` from release-please-config.json after the first
# release PR merges, or every subsequent release will repeat version 0.1.0.
name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'lyra-ds/blade'
    runs-on: ubuntu-latest
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_PAT || secrets.GITHUB_TOKEN }}

      # docs/api.json is regenerated here rather than uploaded from the repository:
      # the committed artifact still carries the previous version, and release-please
      # has just written the new one into the manifest.
      - name: Check out the repository
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v4

      - name: Set up PHP
        if: ${{ steps.release.outputs.release_created }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        if: ${{ steps.release.outputs.release_created }}
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generate the documentation API artifact
        if: ${{ steps.release.outputs.release_created }}
        run: php bin/generate-docs-api

      - name: Attach the artifact to the release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.release.outputs.tag_name }}" docs/api.json --clobber
